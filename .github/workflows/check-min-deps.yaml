# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
#
# Runs R CMD check with the *minimum* versions of the dependencies declared in DESCRIPTION
# (for example ggplot2 (>= 3.5.0) installs ggplot2 3.5.0), so that a lower bound that is too low
# fails CI instead of failing for users with older packages (as with #198).
# It runs twice: on the current R release, and on the minimum R version in DESCRIPTION
# (`R (>= x.y)`), so that the R bound is tested too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: check-min-deps.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  min-deps:
    runs-on: ${{ matrix.os }}
    name: minimum dependency versions (R ${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {r: 'release', os: ubuntu-latest}
          # An old R needs an Ubuntu release that the package manager still builds binaries
          # for, and the Bioconductor mirrors of that era are gone (dampack uses none).
          - {r: 'minimum', os: ubuntu-24.04}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      PKG_USE_BIOCONDUCTOR: false
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Resolve the R version
        id: rver
        run: |
          if [ "${{ matrix.r }}" = "minimum" ]; then
            v=$(grep -oE 'R \(>= *[0-9.]+\)' DESCRIPTION | grep -oE '[0-9.]+')
          else
            v=release
          fi
          echo "R version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rver.outputs.version }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install the minimum versions declared in DESCRIPTION
        run: |
          fields <- read.dcf("DESCRIPTION", fields = c("Depends", "Imports"))
          deps <- trimws(unlist(strsplit(paste(fields[!is.na(fields)], collapse = ","), ",")))
          m <- regmatches(deps, regexec("^([A-Za-z0-9.]+)\\s*\\(>=\\s*([0-9.-]+)\\)$", deps))
          refs <- unlist(lapply(m, function(x) if (length(x) == 3 && x[2] != "R") paste0(x[2], "@", x[3])))
          cat("Installing minimum versions:", refs, sep = "\n  ")
          pak::pkg_install(refs, upgrade = FALSE)
          for (r in refs) cat(sub("@.*", "", r), as.character(packageVersion(sub("@.*", "", r))), "\n")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
