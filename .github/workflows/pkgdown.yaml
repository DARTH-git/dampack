# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Builds the pkgdown website on every PR (to catch broken docs early) and deploys
# it to GitHub Pages on pushes to main. Deployment uses GitHub's Pages artifact
# mechanism, so no gh-pages branch is created. One-time setup by a repo admin:
# Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Until that is done, the site is still built (so broken docs fail CI) but the
# deploy job is skipped instead of failing.
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_source: ${{ steps.pages.outputs.source }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Check whether GitHub Pages is set to deploy from Actions
        id: pages
        run: |
          source=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo "disabled")
          echo "GitHub Pages source: $source"
          echo "source=$source" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Upload site artifact
        if: github.event_name != 'pull_request' && steps.pages.outputs.source == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_source == 'workflow'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
